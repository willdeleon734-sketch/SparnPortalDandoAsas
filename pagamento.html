<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Plano — Sparn Academia</title><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="sparn-config.js"></script><script src="sparn-auth.js"></script>
<style>
:root{--bg:#07111f;--panel:#0e1b2c;--line:#233650;--txt:#f4f8ff;--muted:#9fb1c7;--cyan:#34d8ff;--ok:#65e6a5}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#12355b 0,#07111f 35%);color:var(--txt);font:16px/1.55 Inter,system-ui,sans-serif}.wrap{width:min(1080px,92%);margin:auto}.top{display:flex;align-items:center;justify-content:space-between;padding:22px 0}.brand{font-weight:900;letter-spacing:.12em}.brand span{color:var(--cyan)}a{color:inherit}.btn,button{border:0;border-radius:14px;padding:13px 18px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block;background:linear-gradient(135deg,var(--cyan),#7e9cff);color:#04101d}.btn.alt{background:#15253a;color:#fff;border:1px solid var(--line)}.card{background:rgba(14,27,44,.92);border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:0 20px 60px #0005}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}.hero{padding:48px 0}.eyebrow{color:var(--cyan);font-weight:900;text-transform:uppercase;letter-spacing:.1em;font-size:.78rem}h1{font-size:clamp(2.2rem,6vw,4.6rem);line-height:.98;margin:.25em 0}.muted{color:var(--muted)}label{display:block;font-weight:800;margin:16px 0 6px}input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:#071421;color:#fff;font-size:1rem}.status{padding:12px 14px;border-radius:12px;background:#0a1625;margin:14px 0}.ok{color:var(--ok)}.price{font-size:3rem;font-weight:900}.price small{font-size:1rem;color:var(--muted)}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.kpi{padding:18px;border-radius:18px;background:#091827;border:1px solid var(--line)}.kpi b{display:block;font-size:1.5rem}@media(max-width:700px){.grid,.kpis{grid-template-columns:1fr}.top{gap:12px;flex-wrap:wrap}}
</style></head><body><div class="wrap">
<header class="top"><a class="brand" href="index.html"><span>✦</span> SPARN ACADEMIA</a><a href="perfil-aluno.html">Meu perfil</a></header>
<main class="hero grid"><section><span class="eyebrow">Acesso Beta</span><h1>Todos os caminhos abertos.</h1><p class="muted">Libere o Acesso Beta da Sparn Academia por R$ 11,11.</p><div class="price">R$ 11,11 <small>Acesso Beta</small></div></section>
<section class="card"><h2>Pagamento via PIX</h2><p class="muted">O PIX é criado pelo backend; a credencial privada do Mercado Pago não fica no navegador.</p><div id="pixArea"><button id="createPix">Gerar meu PIX</button></div><div id="payStatus" class="status">Aguardando geração do pagamento.</div><button class="btn alt" id="check">Já paguei — verificar</button></section></main></div>
<script>
let timer;async function verify(){if(await SparnAuth.access()){payStatus.innerHTML='<b class="ok">✓ Pagamento confirmado. Acesso liberado!</b>';clearInterval(timer);setTimeout(()=>location.href="perfil-aluno.html",1200);return true}return false}
(async()=>{const u=await SparnAuth.user();if(!u)location.href="login.html?next=pagamento.html";else verify()})();
createPix.onclick=async()=>{const cfg=window.SPARN_CONFIG;if(!cfg.createPixEndpoint||cfg.createPixEndpoint.startsWith("COLE_")){payStatus.innerHTML="Conecte a Edge Function <b>create-pix</b> em sparn-config.js.";return}const client=await SparnAuth.init();const s=await client.auth.getSession();payStatus.textContent="Gerando PIX…";try{const r=await fetch(cfg.createPixEndpoint,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+s.data.session.access_token},body:JSON.stringify({plan:"sparn-mensal"})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Falha ao gerar PIX");pixArea.innerHTML=(d.qr_code_base64?'<img alt="QR Code PIX" style="display:block;width:min(280px,100%);margin:12px auto;border-radius:18px" src="data:image/png;base64,'+d.qr_code_base64+'">':'')+'<label>PIX Copia e Cola</label><input id="pixCode" readonly value="'+(d.qr_code||'')+'"><p><button id="copyPix">Copiar código PIX</button></p>';document.getElementById("copyPix").onclick=()=>navigator.clipboard.writeText(document.getElementById("pixCode").value);payStatus.textContent="PIX criado. Aguardando confirmação automática…";timer=setInterval(verify,3000)}catch(e){payStatus.textContent=e.message}};
check.onclick=verify;
</script></body></html>
