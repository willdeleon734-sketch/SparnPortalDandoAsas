<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SPARN Academia — Curso</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#080a0b;overflow:hidden}
#course{display:block;border:0;width:100%;height:100dvh;background:#080a0b}
#error{display:none;color:white;font:16px/1.5 system-ui;padding:28px}
</style>
</head>
<body>
<iframe id="course" title="Curso SPARN Academia"></iframe>
<div id="error">Não foi possível abrir este curso.</div>
<script>
(function(){
 const p=new URLSearchParams(location.search);
 const course=(p.get("course")||"").trim();
 const safe=/^(?:\.\/)?curso-[a-z0-9áàâãéêíóôõúç_-]+\.html(?:[?#].*)?$/i.test(course);
 const frame=document.getElementById("course");
 const error=document.getElementById("error");
 if(!safe){frame.style.display="none";error.style.display="block";return}

 frame.src=course;
 frame.addEventListener("load",()=>{
   try{
     const d=frame.contentDocument;
     if(!d)return;
     d.documentElement.classList.add("sparn-mobile-course");
     d.body?.classList.add("sparn-mobile-course");

     let meta=d.querySelector('meta[name="viewport"]');
     if(!meta){
       meta=d.createElement("meta"); meta.name="viewport"; d.head.prepend(meta);
     }
     meta.content="width=device-width,initial-scale=1,viewport-fit=cover";

     const style=d.createElement("style");
     style.id="sparn-universal-mobile-course-css";
     style.textContent=`
       html{font-size:16px!important;-webkit-text-size-adjust:100%!important;text-size-adjust:100%!important;overflow-x:hidden!important}
       body{width:100%!important;max-width:100vw!important;overflow-x:hidden!important;background-attachment:scroll!important}
       *,*::before,*::after{box-sizing:border-box!important}
       img,video,picture,svg,canvas{max-width:100%!important;height:auto!important}
       iframe{max-width:100%!important}
       main,section,article,header,footer,nav,.wrap,.shell,.container,.content,.panel,.hero,.hero-card{
         max-width:100%!important;min-width:0!important
       }
       .wrap,.shell,.container{width:100%!important;padding-left:16px!important;padding-right:16px!important;margin-left:auto!important;margin-right:auto!important}
       h1{font-size:clamp(34px,10vw,54px)!important;line-height:1.02!important;overflow-wrap:anywhere!important}
       h2{font-size:clamp(27px,8vw,38px)!important;line-height:1.08!important;overflow-wrap:anywhere!important}
       h3{font-size:clamp(21px,6vw,29px)!important;line-height:1.15!important}
       p,li,.lesson-body,.card,.topic,.module{font-size:16px!important;line-height:1.62!important}
       .lead{font-size:18px!important;line-height:1.55!important}
       .grid,.cards,.topics,.modules,.learn,.benefits,[class*="grid"]{
         grid-template-columns:1fr!important
       }
       .hero,.hero-card,.panel,.content{padding-left:18px!important;padding-right:18px!important}
       .hero-card,.panel{border-radius:20px!important}
       .actions{display:flex!important;flex-direction:column!important;align-items:stretch!important}
       .btn,.cta,button,[role="button"]{min-height:48px!important;max-width:100%!important}
       .ad-cover,.cover,.module-cover{width:100%!important;max-width:100%!important}
       .ad-cover img,.cover img,.module-cover img{width:100%!important;height:auto!important;object-fit:contain!important}
       table{display:block!important;width:100%!important;max-width:100%!important;overflow-x:auto!important;-webkit-overflow-scrolling:touch!important}
       pre,code{white-space:pre-wrap!important;overflow-wrap:anywhere!important}
       details.lesson,.lesson{margin-left:0!important;margin-right:0!important;width:100%!important}
       summary{min-height:48px!important;display:flex!important;align-items:center!important}
       nav{max-width:100vw!important}
       @media(max-width:420px){
         .wrap,.shell,.container{padding-left:12px!important;padding-right:12px!important}
         .hero,.hero-card,.panel,.content{padding-left:14px!important;padding-right:14px!important}
         p,li,.lesson-body,.card,.topic,.module{font-size:15.5px!important}
       }
     `;
     d.head.appendChild(style);
   }catch(e){
     /* Se algum navegador bloquear injeção, o viewport do próprio curso ainda será respeitado. */
   }
 });
})();
</script>
</body>
</html>
